
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lootjes | Nieuwe trekking</title>
<style>
:root {
  --bg: #f8f5ef;
  --green: #34483e;
  --muted: #79867a;
  --line: #e4e5dc;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--green);
  font-family: Arial, sans-serif;
}
main {
  max-width: 600px;
  margin: auto;
  padding: 42px 22px 80px;
}
header { text-align: center; margin-bottom: 38px; }
.logo {
  font: 46px Georgia, serif;
  margin: 0 0 10px;
}
.subtitle {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
}
h2 {
  font: 27px Georgia, serif;
  margin: 0 0 20px;
}
.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 8px 25px #34483e08;
}
label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin: 18px 0 8px;
}
input, textarea {
  width: 100%;
  border: 1px solid #dce1d9;
  border-radius: 12px;
  background: #fcfcfa;
  padding: 14px;
  font: 16px Arial, sans-serif;
  color: var(--green);
}
textarea { min-height: 90px; resize: vertical; }
button {
  border: 0;
  border-radius: 13px;
  padding: 15px 18px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}
.primary {
  background: var(--green);
  color: white;
  width: 100%;
}
.secondary {
  background: #edf1eb;
  color: var(--green);
  width: 100%;
  margin-top: 12px;
}
.person {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}
.person input { flex: 1; min-width: 0; }
.remove {
  background: #f8eae6;
  color: #925a4f;
  padding: 12px;
}
.note {
  font-size: 12px;
  line-height: 1.6;
  color: var(--muted);
}
</style>
</head>
<body>
<main>
  <header>
    <h1 class="logo">✉️ Lootjes</h1>
    <div class="subtitle">
      Een beetje magie, een mooi cadeau.
    </div>
  </header>

  <section class="card">
    <h2>Nieuwe trekking</h2>
    <p class="subtitle">
      Begin met de details van jullie cadeaufeest.
    </p>

    <label for="naam">Naam van de trekking</label>
    <input id="naam" placeholder="Bijv. Kerst 2026">

    <label for="datum">Datum van het feest</label>
    <input id="datum" type="date">

    <label for="bedrag">Cadeaubudget (€)</label>
    <input id="bedrag" type="number" min="0"
      placeholder="Bijv. 50">

    <label for="info">Extra informatie</label>
    <textarea id="info"
      placeholder="Locatie, afspraken of een persoonlijke boodschap..."></textarea>
  </section>

  <section class="card">
    <h2>Deelnemers</h2>
    <p class="subtitle">
      Voeg iedereen toe die een lootje trekt.
    </p>

    <div id="personen"></div>

    <button class="secondary" type="button"
      onclick="voegPersoonToe()">
      + Deelnemer toevoegen
    </button>
  </section>

  <button class="primary" type="button"
    onclick="toonMelding()">
    Verder naar uitsluitingen
  </button>

  <p class="note">
    Dit is een eerste ontwerp. Gegevens worden nog
    niet opgeslagen en er worden nog geen lootjes getrokken.
  </p>
</main>

<script>
function voegPersoonToe() {
  const lijst = document.getElementById("personen");
  const rij = document.createElement("div");
  rij.className = "person";

  const veld = document.createElement("input");
  veld.placeholder = "Naam deelnemer";
  veld.setAttribute("aria-label", "Naam deelnemer");

  const knop = document.createElement("button");
  knop.type = "button";
  knop.className = "remove";
  knop.textContent = "✕";
  knop.setAttribute("aria-label", "Verwijder deelnemer");
  knop.onclick = () => rij.remove();

  rij.append(veld, knop);
  lijst.appendChild(rij);
}

function toonMelding() {
  alert("De uitsluitingen bouwen we in de volgende stap.");
}

voegPersoonToe();
voegPersoonToe();
</script>
</body>
</html>
